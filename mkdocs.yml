site_name: pybiotime
site_description: Unofficial typed Python client for the ZKTeco BioTime REST API.
strict: true
repo_url: https://github.com/MalikZu/pybiotime

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Authentication: authentication.md
  - Reading punches: punches.md
  - Employees and structure: personnel.md
  - Errors: errors.md
  - BioTime versions: versions.md
  - Testing your code: testing.md
  - Contributing: contributing.md
