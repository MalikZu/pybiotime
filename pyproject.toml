[project]
name = "pybiotime"
version = "0.0.0"
description = "Unofficial typed Python client for the ZKTeco BioTime REST API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["biotime", "zkteco", "attendance", "time-attendance", "biometric", "api-client"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# Ranges must stay inside what Frappe v15 and v16 pin, so both can install us.
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/pybiotime", "tests", "LICENSE", "README.md"]

[tool.ruff]
line-length = 100
# Lowest supported version: ruff then refuses syntax newer than 3.10.
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "PT", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pybiotime"]
branch = true
